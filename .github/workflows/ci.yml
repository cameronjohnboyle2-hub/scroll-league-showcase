name: CI

permissions:
  contents: read

on:
  push:
    branches: [Website]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run export:demo

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations and fictional seed
        run: supabase db reset
      - name: Run database acceptance tests
        run: supabase test db
